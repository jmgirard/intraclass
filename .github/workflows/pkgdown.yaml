# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The runner installs binary packages from RSPM, so glmmTMB's binary can
      # be built against an older TMB than the TMB that gets installed beside
      # it. glmmTMB then warns from .onLoad, and because intraclass imports
      # glmmTMB that warning renders into every vignette that loads the
      # package. Rebuilding glmmTMB from source against the installed TMB
      # removes the skew at its source rather than muting the message.
      - name: Check glmmTMB against the installed TMB
        id: tmb-skew
        run: |
          matched <- TRUE
          withCallingHandlers(
            loadNamespace("glmmTMB"),
            warning = function(w) {
              if (grepl("package version mismatch", conditionMessage(w), fixed = TRUE)) {
                matched <<- FALSE
              }
              invokeRestart("muffleWarning")
            }
          )
          cat(sprintf("glmmTMB %s / TMB %s: matched=%s\n",
                      packageVersion("glmmTMB"), packageVersion("TMB"), matched))
          cat(sprintf("matched=%s\n", tolower(as.character(matched))),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Rebuild glmmTMB from source against the installed TMB
        if: steps.tmb-skew.outputs.matched != 'true'
        run: |
          install.packages("glmmTMB", type = "source", repos = "https://cloud.r-project.org")
          matched <- TRUE
          withCallingHandlers(
            loadNamespace("glmmTMB"),
            warning = function(w) {
              if (grepl("package version mismatch", conditionMessage(w), fixed = TRUE)) {
                matched <<- FALSE
              }
              invokeRestart("muffleWarning")
            }
          )
          if (!matched) {
            stop("glmmTMB is still built against a different TMB after the source rebuild")
          }
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Guards the prevention above: reds if any built page still shows a
      # load-time version-skew warning, before anything is published.
      - name: Check the built pages for load-time version-skew warnings
        run: |
          python3 data-raw/check-vignette-render-warnings.py --self-test
          python3 data-raw/check-vignette-render-warnings.py docs
        shell: bash

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
