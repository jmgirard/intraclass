# TEMPORARY measurement instrument for M139 — deleted once the floor is
# recorded. Runs the candidate R versions on one fixed OS so the only axis
# that varies is the R version. The permanent pinned-floor job lives in
# check-standard.yaml.
on:
  push:
    branches: [m139-r-floor-ci-tested]
  workflow_dispatch:

name: r-floor-sweep.yaml

permissions: read-all

jobs:
  floor-sweep:
    runs-on: ubuntu-22.04

    name: R ${{ matrix.r }}

    strategy:
      fail-fast: false
      matrix:
        r: ['4.0.0', '4.1.3', '4.2.3', '4.3.3', '4.4.0', '4.4.3', '4.5.1']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        id: setup
        continue-on-error: true
        with:
          r-version: ${{ matrix.r }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        id: deps
        continue-on-error: true
        if: steps.setup.outcome == 'success'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        id: check
        continue-on-error: true
        if: steps.deps.outcome == 'success'
        with:
          upload-snapshots: false
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Report outcome
        if: always()
        run: |
          {
            echo "## R ${{ matrix.r }}"
            echo "- setup-r: ${{ steps.setup.outcome }}"
            echo "- dependency install: ${{ steps.deps.outcome || 'skipped' }}"
            echo "- R CMD check: ${{ steps.check.outcome || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
